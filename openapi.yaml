          type: string
          format: uuid
        apiVersion:
          type: string
          const: v1
        data:
          description: 'In /events la fotografia del fatto, com''era quando è accaduto (guest della prenotazione
            nullo); nel webhook la prenotazione di quando parte, e updatedAt dice quale è più nuova. guest_profile_changed:
            in /events solo l''id dell''ospite, nel webhook la scheda intera.'
          anyOf:
          - type: object
            properties:
              reservation:
                anyOf:
                - $ref: '#/components/schemas/Reservation'
                - type: 'null'
            required:
            - reservation
          - type: object
            properties:
              waitlistEntry:
                anyOf:
                - $ref: '#/components/schemas/WaitlistEntry'
                - type: 'null'
            required:
            - waitlistEntry
