components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Il codice su cui ramificare
            message:
              type: string
              description: Per chi legge i log
            details:
              type: object
              description: 'Cosa serve per correggere o riprovare: fields (i campi storti), requiredScope,
                reason; per no_availability anche alternatives, gli orari vicini nella forma di GET /availability;
                per rate_limited limit, window e scope della finestra che ha fermato la richiesta, e resetAt'
              properties:
                fields:
                  type: array
                  items:
                    type: string
                requiredScope:
                  type: string
                reason:
                  type: string
                alternatives:
                  type: array
                  items:
                    $ref: '#/components/schemas/Proposal'
                limit:
                  type: integer
                  description: 'rate_limited: il tetto della finestra che ha fermato la richiesta'
                window:
                  type: string
                  description: 'rate_limited: 10s o day (organizzazione), minute (visitatore del widget)'
                  enum:
                  - 10s
                  - day
                  - minute
                scope:
                  type: string
                  description: 'rate_limited: di chi è il limite'
                  enum:
                  - organization
                  - visitor
                resetAt:
                  type: string
                  format: date-time
                  description: 'rate_limited: quando la finestra riparte'
            requestId:
              type: string
              description: Lo stesso valore dell'header X-Request-Id
          required:
          - code
          - message
          - details
      required:
      - error
    Me:
      type: object
      properties:
        organization:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
          - id
          - name
        apiKey:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            scopes:
              type: array
              items:
                type: string
                enum:
                - reservations:read
                - reservations:write
                - waitlist:read
                - waitlist:write
                - guests:read
                - guests:write
                - venues:read
                - floor:read
                - floor:write
                - reports:read
                - events:read
                - imports:write
                - webhooks:read
                - webhooks:write
          required:
          - id
          - name
          - scopes
        rateLimit:
          type: object
          properties:
            limit:
              type: integer
              description: 'Il tetto della finestra più stretta dell''organizzazione, quella con meno
                richieste rimaste: 100 ogni 10 secondi o 20000 al giorno UTC'
            remaining:
              type: integer
              description: Richieste rimaste in quella finestra
            resetAt:
              type: string
              description: Quando quella finestra riparte
              format: date-time
          required:
          - limit
          - remaining
          - resetAt
        livemode:
          type: boolean
          description: Falso per le chiavi dell'organizzazione di prova (gsk_test_)
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
      required:
      - organization
      - apiKey
      - rateLimit
      - livemode
      - venues
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: Fuso orario IANA
          examples:
          - Europe/Rome
        noShowToleranceMinutes:
          type: integer
        updatedAt:
          type: string
          description: Istante ISO 8601 con fuso
          format: date-time
      required:
      - id
      - name
      - timezone
      - noShowToleranceMinutes
      - updatedAt
    Shift:
