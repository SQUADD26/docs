                    properties:
                      id:
                        type: string
                        format: uuid
                    required:
                    - id
                - type: 'null'
              reason:
                anyOf:
                - type: string
                  description: guest_created, profile_changed, service_tags_changed
                - type: 'null'
            required:
            - guest
            - reason
